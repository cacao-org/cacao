name: CMake

on:
  push:
  pull_request:
  schedule:
  - cron: '0 13 * * 1'

env:
  BUILD_TYPE: Release
  # milk branch that cacao is built against
  MILK_REF: dev

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq libcfitsio-dev libreadline-dev libncurses-dev libfftw3-dev libgsl-dev flex bison \
          gfortran libopenblas-dev liblapacke-dev

    - name: Checkout milk
      uses: actions/checkout@v4
      with:
        repository: milk-org/milk
        ref: ${{ env.MILK_REF }}
        path: milk

    # Build this commit of cacao, not upstream cacao (milk's fetch_cacao_dev.sh
    # would clone cacao-org/cacao dev instead).
    - name: Checkout cacao
      uses: actions/checkout@v4
      with:
        path: milk/plugins/cacao-src

    - name: Configure CMake
      working-directory: ${{ github.workspace }}/milk
      run: cmake -S . -B _build -DINSTALLMAKEDEFAULT=ON -DCMAKE_BUILD_TYPE="$BUILD_TYPE"

    - name: Build
      working-directory: ${{ github.workspace }}/milk
      run: cmake --build _build --config "$BUILD_TYPE" -j "$(nproc)"
