[tox]
envlist = docs
skipsdist = true

[testenv:docs]
description = Build the HTML documentation (warnings are errors)
skip_install = true
deps = -r docs/requirements.txt
commands = sphinx-build -W --keep-going -b html docs docs/_build/html {posargs}

[testenv:docs-linkcheck]
description = Check external links in the documentation
skip_install = true
deps = -r docs/requirements.txt
commands = sphinx-build -b linkcheck docs docs/_build/linkcheck {posargs}
