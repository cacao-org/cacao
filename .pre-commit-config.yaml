exclude: "^.github/"
repos:
-   repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
    -   id: black
        files: \.py$
-   repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
    -   id: clang-format
        types_or: [c, c++]
        exclude: 'tree-sitter-milkcli/'
-   repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
    -   id: cmake-format
        args: ['--enable-markup=False']
-   repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.5
    hooks:
    -   id: prettier
        types_or: [markdown]
-   repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        exclude: \.fits
    -   id: end-of-file-fixer
        exclude: \.fits
    -   id: check-yaml
        exclude: mkdocs\.yml$
    -   id: debug-statements
    -   id: requirements-txt-fixer
    -   id: check-added-large-files
    -   id: check-ast
    -   id: check-merge-conflict
        # default hook only scans when MERGE_HEAD/MERGE_MSG exist,
        # so it misses markers left by e.g. a stash-pop conflict
        args: ['--assume-in-merge']
